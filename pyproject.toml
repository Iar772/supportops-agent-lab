[project]
name = "supportops-agent-lab"
version = "0.1.0"
requires-python = ">=3.12.6"
dependencies = [
    "httpx>=0.28.1",
    "langchain>=1.4.8",
    "langchain-ollama>=1.1.0",
    "pydantic>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
